name: "Good Tools"
version: "1.4.1"
slug: "good_tools"
image: "ghcr.io/redchupa/ha-good-tools"
description: "Home Assistant에서 바로 사용하는 올인원 온라인 유틸리티 & 개발자 도구 모음"
url: "https://github.com/redchupa/ha_good_tools"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:toolbox-outline
panel_title: "Good Tools"
options:
  ha_user_ids: []
  allow_template_eval: false
  notify_service: ""
  log_level: "info"
  allow_network_tools: true
  allow_lan_tools: false
  default_theme: "system"
schema:
  ha_user_ids:
    - str
  allow_template_eval: bool
  notify_service: "str?"
  log_level: list(debug|info|warning|error)
  allow_network_tools: bool
  allow_lan_tools: bool
  default_theme: list(system|light|dark|ha-blue|peach-cute|mint-cream|sakura|lavender|sunset|cyberpunk|mecha-bot|aurora|ocean|forest|rose-dark)
