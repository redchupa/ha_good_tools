name: Package verified sub-HA build
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA verified on the sub HA
        required: true
      version:
        description: Release version
        required: true
permissions:
  contents: read
  statuses: read
  packages: write
concurrency: publish-good-tools
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ inputs.commit }}
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/ha-good-tools
    steps:
      - name: Validate release inputs and sub-HA verification
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '.statuses[] | select(.context=="sub-ha/verified" and .state=="success") | .description')
          [[ "$status" =~ ^[a-f0-9]{64}$ ]]
          echo "DIST_SHA=$status" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Download verified frontend
        run: |
          grep -Fx "version: \"$VERSION\"" good_tools/config.yaml
          gh release download "v$VERSION-rc.1" --repo "$GITHUB_REPOSITORY" -p web-dist.tar.gz
          echo "$DIST_SHA  web-dist.tar.gz" | sha256sum -c -
          mkdir good_tools/web-dist
          tar -xzf web-dist.tar.gz -C good_tools/web-dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build runtime images
        run: |
          for spec in amd64:linux/amd64:3.23 aarch64:linux/arm64:3.23 armv7:linux/arm/v7:3.22; do
            IFS=: read -r arch platform alpine <<< "$spec"
            docker buildx build good_tools --platform "$platform" --provenance=false \
              --build-arg WEB_STAGE=verified --build-arg BUILD_FROM="ghcr.io/home-assistant/$arch-base:$alpine" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$SHA" \
              --tag "$IMAGE:$VERSION-$arch-$SHA" --push
          done
          docker buildx imagetools create --tag "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64-$SHA" "$IMAGE:$VERSION-aarch64-$SHA" "$IMAGE:$VERSION-armv7-$SHA"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
